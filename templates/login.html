<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freezer Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0b0f14;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            padding: 30px;
            background: #111820;
            border: 1px solid #27313b;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
        }

        .logo {
            text-align: center;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #8b98a5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 7px;
            color: #c9d1d9;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #303b46;
            border-radius: 10px;
            background: #0b0f14;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #ffffff;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #0b0f14;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .error {
            background: #351820;
            color: #ff8c9c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #66727e;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🥶</div>

    <h1>Freezer Dashboard</h1>

    <div class="subtitle">
        Sign in to continue
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="/login">

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            🔐 LOGIN
        </button>

    </form>

    <div class="footer">
        🥶 Freezer Python Project
    </div>

</div>

</body>
</html>
